<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B1E5C">
<title>Colorix</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Colorix">
<link rel="apple-touch-startup-image"
      href="./icons/splash-1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)">
<link rel="stylesheet" href="./app/styles.css">
</head>
<body>
<div id="ecran"></div>
<nav id="onglets" hidden></nav>
<script>
/* Le service worker s'enregistre ici, hors du graphe de modules, et non dans
   `principal.js` : une erreur de syntaxe dans n'importe quel module empêchait
   alors l'enregistrement, donc la réception du correctif. L'écran blanc
   devenait définitif — sauf à retirer la web app de l'écran d'accueil, ce qui
   efface son IndexedDB et tout le travail avec.

   Le rechargement sur `controllerchange` évite qu'une mise à jour ne se voie
   qu'au lancement suivant : le worker s'installe au premier, la page n'en
   profiterait qu'au second. */
if ('serviceWorker' in navigator) {
  let recharge = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (recharge) return;
    recharge = true;
    location.reload();
  });
  navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
}
navigator.storage?.persist?.().catch(function () {});
</script>
<script type="module" src="./app/principal.js"></script>
</body>
</html>
